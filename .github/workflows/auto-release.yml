name: Auto Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Token admin (Dr0drigues) : bypass la protection de main (enforce_admins=false).
          # Le GITHUB_TOKEN par defaut est bloque par la regle "require a pull request".
          # Fallback sur github.token si le secret est absent : checkout OK + skip OK,
          # seul le push du bump echouera (comme avant) tant que RELEASE_TOKEN n'existe pas.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          fetch-depth: 0
          fetch-tags: true

      - name: Determine bump type from branch name
        id: bump
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "Source branch: $BRANCH"

          if [[ "$BRANCH" == breaking/* ]]; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == hotfix/* ]]; then
            echo "type=patch" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == feature/* || "$BRANCH" == feat/* ]]; then
            echo "type=minor" >> $GITHUB_OUTPUT
          else
            echo "Branch '$BRANCH' does not match breaking/*, feature/*, feat/* or hotfix/* — skipping release."
            echo "type=skip" >> $GITHUB_OUTPUT
          fi

      - name: Calculate new version
        id: version
        if: steps.bump.outputs.type != 'skip'
        run: |
          # Le tag le plus ELEVE, tous tags confondus — et non le plus PROCHE dans
          # l'historique. `git describe --tags origin/main` rendait ce dernier, ce qui
          # suppose que le tag le plus recent soit un ancetre de main. La reecriture
          # d'historique du 2026-08-12 a casse cette hypothese : six tags v4.x n'ont pas pu
          # etre reecrits — leurs releases sont immuables et GitHub refuse de les deplacer —
          # donc ils pointent vers des commits devenus orphelins. `git describe` remontait
          # alors a v3.13.0, et le workflow a publie v3.13.1 APRES v4.4.0, en faisant
          # reculer la version du projet dans core/ui.zsh et cli/Cargo.toml.
          CURRENT=$(git tag --list 'v[0-9]*' | sed 's/^v//' \
              | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
          CURRENT="v${CURRENT:-0.0.0}"
          VERSION=${CURRENT#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          case "${{ steps.bump.outputs.type }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"

          # Le filet, et non le calcul : quelle que soit la raison, une version ne recule
          # pas. Sans ce refus, l'erreur ci-dessus s'est publiee toute seule — et une
          # release GitHub est IMMUABLE, donc irreparable une fois sortie. Echouer
          # bruyamment coute une relance ; publier a l'envers coute un numero definitif.
          DECLARED=$(sed -n 's/.*ZANVIL_VERSION="v\([0-9][0-9.]*\)".*/\1/p' core/ui.zsh | head -1)
          if [[ -n "$DECLARED" ]]; then
            HIGHEST=$(printf '%s\n%s\n' "$DECLARED" "${NEW_TAG#v}" \
                | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)
            # L'egalite est refusee elle aussi : apres un bump normal, la version declaree
            # vaut le tag publie, donc le bump suivant est strictement superieur. Retomber
            # sur le meme numero signale une anomalie — et republier un tag existant
            # echouerait plus loin, sur une etape qui ne dirait pas pourquoi.
            if [[ "$DECLARED" == "${NEW_TAG#v}" || "$HIGHEST" != "${NEW_TAG#v}" ]]; then
              echo "::error::$NEW_TAG n'est pas strictement superieur a la version declaree v$DECLARED dans core/ui.zsh."
              echo "::error::Publier reculerait ou repeterait la version. Verifier les tags : un tag orphelin fausse le calcul."
              exit 1
            fi
          fi

          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "previous=$CURRENT" >> $GITHUB_OUTPUT
          echo "New version: $NEW_TAG (was $CURRENT, declared v$DECLARED)"

      # Les DEUX versions, et pas seulement celle du zsh : un binaire qui annonce une
      # version differente de son projet est precisement ce qui a fait passer
      # zsh-env-cli v3.0.0 pour une installation valide pendant quatre mois. Le CLI
      # etait reste en 3.1.0 alors que le projet affichait v4.4.0.
      - name: Bump version in core/ui.zsh and cli/Cargo.toml
        if: steps.bump.outputs.type != 'skip'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sed -i 's/export ZANVIL_VERSION="v[^"]*"/export ZANVIL_VERSION="${{ steps.version.outputs.tag }}"/' core/ui.zsh
          # Le tag porte un « v » que Cargo n'accepte pas dans un champ version. Le
          # retrait passe par une variable intermediaire : ${VAR#v} est du bash, et
          # l'imbriquer dans une expression GitHub ne l'est pas.
          #
          # Ne PAS ecrire cette expression en clair ici, meme derriere un diese. Le diese
          # commente pour le shell, pas pour GitHub : les expressions sont substituees dans
          # tout le bloc `run` avant qu'aucun shell ne le lise. Une expression vide est
          # invalide, elle fait rejeter le fichier ENTIER, et le workflow ne tourne plus du
          # tout — il n'echoue pas dans un job, il n'en cree aucun. C'est arrive le
          # 2026-08-03 et plus aucune release n'est sortie pendant neuf jours.
          TAG="${{ steps.version.outputs.tag }}"
          CARGO_VERSION="${TAG#v}"
          # python3 plutot que sed : la premiere version de cette etape utilisait
          # `sed -i "0,/^version = /s/..."`, une plage GNU que le sed de macOS ignore en
          # silence. Le workflow tourne sur ubuntu, donc ca aurait marche — mais personne
          # n'aurait pu le verifier localement, et c'est precisement le genre de
          # dependance a une variante que ce depot cherche a retirer.
          python3 - "$CARGO_VERSION" <<'PY'
          import re, sys, pathlib
          p = pathlib.Path("cli/Cargo.toml")
          # Seule la version du paquet, pas celles des dependances : on borne au premier
          # `version =` qui suit `[package]`.
          s = p.read_text()
          i = s.index("[package]")
          j = s.index("\n[", i + 1) if "\n[" in s[i + 1:] else len(s)
          bloc = re.sub(r'^version = ".*"$', f'version = "{sys.argv[1]}"', s[i:j], count=1, flags=re.M)
          p.write_text(s[:i] + bloc + s[j:])

          # Cargo.lock porte aussi la version du paquet, et il etait laisse en arriere : le
          # 2026-08-12, main avait Cargo.toml en 3.13.1 et Cargo.lock en 4.4.0. Rien n'a
          # casse — aucune etape du CI n'emploie `--locked`, donc cargo regenere le fichier
          # en silence — mais c'est la meme incoherence de version que ce workflow existe
          # pour supprimer, et elle reviendrait a chaque release.
          #
          # L'edition est directe, faute de toolchain Rust a cette etape : y installer cargo
          # pour changer trois caracteres couterait une minute a chaque release.
          lock = pathlib.Path("cli/Cargo.lock")
          if lock.exists():
              t = lock.read_text()
              # Seul le bloc du paquet zanvil : les dependances ont leurs propres versions.
              t2 = re.sub(r'(\[\[package\]\]\nname = "zanvil"\nversion = )"[^"]*"',
                          lambda m: m.group(1) + f'"{sys.argv[1]}"', t, count=1)
              if t2 != t:
                  lock.write_text(t2)
          PY
          git add core/ui.zsh cli/Cargo.toml cli/Cargo.lock
          git commit -m "chore(release): bump version to ${{ steps.version.outputs.tag }}"
          git push origin main

      - name: Create git tag
        if: steps.bump.outputs.type != 'skip'
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.bump.outputs.type != 'skip'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --notes-start-tag "${{ steps.version.outputs.previous }}"
