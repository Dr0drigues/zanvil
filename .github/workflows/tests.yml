name: Tests

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  smoke-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zsh (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh jq curl

      # « Verify zsh loads without errors » a ete retiree : elle construisait
      # l isolation a la main puis n assertait rien, et copiait
      # examples/config.zsh.example, dont le ZANVIL_PLUGINS declenche un git clone.
      # Remplacee par le cas rc-loads-without-an-error du job « cases ».

      - name: Verify core files exist
        run: |
          for f in rc.zsh core/ui.zsh core/loader.zsh core/variables.zsh core/aliases.zsh core/hooks.zsh core/commands/commands.zsh core/commands/admin.zsh core/commands/theme.zsh; do
            if [ -f "$f" ]; then
              echo "OK: $f"
            else
              echo "MISSING: $f" && exit 1
            fi
          done

      - name: Verify modules structure
        run: |
          for mod in git gitlab kube docker ssh ai project security utils tools work; do
            if [ -f "modules/$mod/init.zsh" ]; then
              echo "OK: modules/$mod/init.zsh"
            else
              echo "MISSING: modules/$mod/init.zsh" && exit 1
            fi
          done

      - name: Test shell script suites
        run: |
          export ZANVIL_DIR="$PWD"
          bash scripts/tests/k9s-log-fmt.test.sh
          bash scripts/tests/zsh-special-vars.test.sh

      # Conservee volontairement, et ce n est pas de la prudence : gaveldrop ne
      # peut pas exprimer ce cas. fake.bins est global a gaveldrop.yaml et le bloc
      # fake: d un cas n accepte que render et rules, donc declarer
      # posting/delta/lazygit/atuin pour tester leur branche « present » rend leur
      # branche « absent » inatteignable sur toute machine. Cette etape est la seule
      # couverture de cette moitie du code. Voir
      # web/docs/superpowers/specs/2026-07-30-gaveldrop-test-suite-design.md, mur n1.
      - name: Test binary-absent fallback warnings
        run: |
          export ZANVIL_DIR="$PWD"
          export HOME="$(mktemp -d)"

          check_warning() {
            local module="$1" guard="$2" grep_pattern="$3"
            local out
            out=$(zsh -c "
              ${guard}=true
              ZANVIL_DIR='$PWD'
              PATH=/usr/bin:/bin
              source '$PWD/modules/tools/${module}/init.zsh' 2>&1
            ")
            echo "${module}: ${out}"
            echo "${out}" | grep -q "${grep_pattern}" \
              || { echo "FAIL: ${module} warning absent (attendu: ${grep_pattern})"; exit 1; }
          }

          check_warning posting  ZANVIL_MODULE_POSTING  "brew install posting"
          check_warning delta    ZANVIL_MODULE_DELTA    "brew install git-delta"
          check_warning lazygit  ZANVIL_MODULE_LAZYGIT  "brew install lazygit"
          check_warning atuin    ZANVIL_MODULE_ATUIN    "brew install atuin"

          echo "All binary-absent fallback warnings OK"

  rust-cli:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('cli/Cargo.lock') }}

      - name: Build CLI
        run: cd cli && cargo build --release

      # « Test CLI commands » a ete retiree : elle lancait cinq commandes, trois
      # terminees par || true, sans asserter quoi que ce soit d aucune sortie —
      # doctor pouvait paniquer sans faire echouer le job. Remplacee par les cinq
      # cas tests/cases/cli/ du job « cases », qui verifient chacun le code de
      # sortie et au moins une chose de la sortie.

  cases:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # zsh n est pas sur l image ubuntu : elle ne fournit que bash, dash et
      # PowerShell. macOS l a par defaut depuis des annees.
      - name: Install zsh (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh jq

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            cli/target
          key: ${{ runner.os }}-gaveldrop-6d896b8-${{ hashFiles('cli/Cargo.lock') }}

      # gaveldrop n est pas publie et n a aucun tag : le SHA est pinne pour que la
      # CI de zanvil ne rougisse pas au prochain commit d un autre depot. Le bump
      # est un geste explicite.
      # Les DEUX binaires sont necessaires : sans gaveldrop-fake, toute execution
      # meurt sur « the fake binary was not found beside this executable ».
      - name: Install gaveldrop
        run: |
          cargo install --git https://github.com/Dr0drigues/gaveldrop \
            --rev 6d896b83b3bbe772700b75c5ecd1e1f94ed6fb2c --locked gaveldrop-cli
          cargo install --git https://github.com/Dr0drigues/gaveldrop \
            --rev 6d896b83b3bbe772700b75c5ecd1e1f94ed6fb2c --locked gaveldrop-fake

      # Les cinq cas CLI invoquent ce binaire par son chemin.
      - name: Build the zanvil CLI
        run: cd cli && cargo build --release

      # --annotate place l echec sur la ligne de l assertion qui casse, pas dans un
      # log que personne ne deroule.
      - name: Run the cases
        run: gaveldrop --annotate --report-junit junit.xml

      # if: always() — le rapport est le plus utile quand l etape precedente a
      # echoue.
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cases-${{ matrix.os }}
          path: junit.xml
