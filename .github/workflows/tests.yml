name: Tests

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  smoke-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zsh (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh jq curl

      # « Verify zsh loads without errors » a ete retiree : elle construisait
      # l isolation a la main puis n assertait rien, et copiait
      # examples/config.zsh.example, dont le ZANVIL_PLUGINS declenche un git clone.
      # Remplacee par le cas rc-loads-without-an-error du job « cases ».

      - name: Verify core files exist
        run: |
          for f in rc.zsh core/ui.zsh core/loader.zsh core/variables.zsh core/aliases.zsh core/hooks.zsh core/commands/commands.zsh core/commands/admin.zsh core/commands/theme.zsh; do
            if [ -f "$f" ]; then
              echo "OK: $f"
            else
              echo "MISSING: $f" && exit 1
            fi
          done

      - name: Verify modules structure
        run: |
          for mod in git gitlab kube docker ssh ai project security utils tools work; do
            if [ -f "modules/$mod/init.zsh" ]; then
              echo "OK: modules/$mod/init.zsh"
            else
              echo "MISSING: modules/$mod/init.zsh" && exit 1
            fi
          done

      - name: Test shell script suites
        run: |
          export ZANVIL_DIR="$PWD"
          bash scripts/tests/k9s-log-fmt.test.sh
          bash scripts/tests/zsh-special-vars.test.sh

      # « Test binary-absent fallback warnings » a ete retiree. Elle amputait PATH a
      # la main pour prouver qu un module previent quand son binaire manque, ce que le
      # format ne savait pas exprimer. `setup.hide` le sait depuis, donc les quatre cas
      # `*-warns-when-its-binary-is-missing` de tests/cases/modules/ la remplacent —
      # avec un verdict identique sur un poste equipe et sur un runner nu, ce que
      # l amputation de PATH ne garantissait que par accident.

  rust-cli:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('cli/Cargo.lock') }}

      - name: Build CLI
        run: cd cli && cargo build --release

      # « Test CLI commands » a ete retiree : elle lancait cinq commandes, trois
      # terminees par || true, sans asserter quoi que ce soit d aucune sortie —
      # doctor pouvait paniquer sans faire echouer le job. Remplacee par les cinq
      # cas tests/cases/cli/ du job « cases », qui verifient chacun le code de
      # sortie et au moins une chose de la sortie.

  cases:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # zsh n est pas sur l image ubuntu : elle ne fournit que bash, dash et
      # PowerShell. macOS l a par defaut depuis des annees.
      - name: Install zsh (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh jq

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          # Le cache ne couvre que la compilation du CLI zanvil : gaveldrop arrive
          # precompile, donc ~/.cargo/bin n a pas a etre cache — et c est ce qui evite
          # le --force qu un binaire restaure imposerait.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: ${{ runner.os }}-cases-${{ hashFiles('cli/Cargo.lock') }}

      # Les cinq cas CLI invoquent ce binaire par son chemin.
      - name: Build the zanvil CLI
        run: cd cli && cargo build --release

      # L action officielle, qui remplace vingt lignes de telechargement et de
      # verification sha256. Elle n etait pas utilisable jusqu ici : ajoutee au depot
      # APRES le tag v0.1.0, la reference ne resolvait pas et le job mourait en trois
      # secondes sur « Can't find 'action.yml' ». v0.1.2 la contient — verifie par
      # `git ls-tree v0.1.2:action`.
      #
      # v0.1.2 est un minimum, pas une preference : c est la version qui apporte
      # setup.stdin, equals et ignore_ansi, dont depend chaque cas de tests/cases/k9s/,
      # et deja setup.hide sur un outil fake pour les quatre cas
      # `*-warns-when-its-binary-is-missing`.
      #
      # --annotate place l echec sur la ligne de l assertion qui casse, pas dans un log
      # que personne ne deroule.
      - name: Run the cases
        uses: Dr0drigues/gaveldrop/action@v0.1.2
        with:
          args: --annotate --report-junit junit.xml

      # if: always() — le rapport est le plus utile quand l etape precedente a echoue.
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cases-${{ matrix.os }}
          path: junit.xml
