name: Tests

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  smoke-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zsh (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh jq curl

      # « Verify zsh loads without errors » a ete retiree : elle construisait
      # l isolation a la main puis n assertait rien, et copiait
      # examples/config.zsh.example, dont le ZANVIL_PLUGINS declenche un git clone.
      # Remplacee par le cas rc-loads-without-an-error du job « cases ».

      - name: Verify core files exist
        run: |
          for f in rc.zsh core/ui.zsh core/loader.zsh core/variables.zsh core/aliases.zsh core/hooks.zsh core/commands/commands.zsh core/commands/admin.zsh core/commands/theme.zsh; do
            if [ -f "$f" ]; then
              echo "OK: $f"
            else
              echo "MISSING: $f" && exit 1
            fi
          done

      - name: Verify modules structure
        run: |
          for mod in git gitlab kube docker ssh ai project security utils tools work; do
            if [ -f "modules/$mod/init.zsh" ]; then
              echo "OK: modules/$mod/init.zsh"
            else
              echo "MISSING: modules/$mod/init.zsh" && exit 1
            fi
          done

      - name: Test shell script suites
        run: |
          export ZANVIL_DIR="$PWD"
          bash scripts/tests/k9s-log-fmt.test.sh
          bash scripts/tests/zsh-special-vars.test.sh

      # « Test binary-absent fallback warnings » a ete retiree. Elle amputait PATH a
      # la main pour prouver qu un module previent quand son binaire manque, ce que le
      # format ne savait pas exprimer. `setup.hide` le sait depuis, donc les quatre
      # cas de tests/cases-hidden/ la remplacent — avec un verdict identique sur un
      # poste equipe et sur un runner nu, ce que l amputation de PATH ne garantissait
      # que par accident.

  rust-cli:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('cli/Cargo.lock') }}

      - name: Build CLI
        run: cd cli && cargo build --release

      # « Test CLI commands » a ete retiree : elle lancait cinq commandes, trois
      # terminees par || true, sans asserter quoi que ce soit d aucune sortie —
      # doctor pouvait paniquer sans faire echouer le job. Remplacee par les cinq
      # cas tests/cases/cli/ du job « cases », qui verifient chacun le code de
      # sortie et au moins une chose de la sortie.

  cases:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # zsh n est pas sur l image ubuntu : elle ne fournit que bash, dash et
      # PowerShell. macOS l a par defaut depuis des annees.
      - name: Install zsh (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh jq

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            cli/target
          # Le SHA de gaveldrop fait partie de la cle : ~/.cargo/bin est cache, donc
          # un bump doit invalider l entree, sinon l ancien binaire serait reutilise.
          key: ${{ runner.os }}-cases-d939eef-${{ hashFiles('cli/Cargo.lock') }}

      # Les cinq cas CLI invoquent ce binaire par son chemin.
      - name: Build the zanvil CLI
        run: cd cli && cargo build --release

      # L action officielle serait plus simple — elle installe des binaires
      # precompiles et accepte install-only, ce qu il faut ici puisqu il y a deux
      # configurations a lancer. Mais `Dr0drigues/gaveldrop/action@v0.1.0` ne resout
      # pas : l action a ete ajoutee au depot APRES le tag v0.1.0, et
      # `git tag --contains` sur son commit ne renvoie rien. GitHub echoue au
      # demarrage du job, en trois secondes :
      #   Can't find 'action.yml' … for action 'Dr0drigues/gaveldrop/action@v0.1.0'
      # A rebasculer sur l action des qu un tag la contient.
      #
      # Le SHA est pinne pour que la CI de zanvil ne rougisse pas au prochain commit
      # d un autre depot ; celui-ci porte setup.hide, dont dependent les quatre cas
      # de tests/cases-hidden/. Les DEUX binaires sont necessaires : cargo n installe
      # pas les binaires des dependances, et sans gaveldrop-fake toute execution meurt
      # sur « the fake binary was not found beside this executable ».
      - name: Install gaveldrop
        run: |
          cargo install --git https://github.com/Dr0drigues/gaveldrop \
            --rev d939eef13ab9f72f9f4877b35a9ea685e4b67611 --locked gaveldrop-cli
          cargo install --git https://github.com/Dr0drigues/gaveldrop \
            --rev d939eef13ab9f72f9f4877b35a9ea685e4b67611 --locked gaveldrop-fake

      # --annotate place l echec sur la ligne de l assertion qui casse, pas dans un
      # log que personne ne deroule.
      - name: Run the cases
        run: gaveldrop --annotate --report-junit junit.xml

      # Seconde configuration, pour une raison structurelle : un outil ne peut pas
      # etre a la fois fake (branche « binaire present ») et cache (branche
      # « binaire absent »), et fake.bins vit dans la configuration, pas dans le cas.
      - name: Run the hidden-tool cases
        run: gaveldrop --config gaveldrop.hidden.yaml --annotate --report-junit junit-hidden.xml

      # if: always() — les rapports sont le plus utiles quand une etape precedente a
      # echoue.
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cases-${{ matrix.os }}
          path: junit*.xml
