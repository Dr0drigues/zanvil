# yaml-language-server: $schema=https://raw.githubusercontent.com/Dr0drigues/gaveldrop/main/docs/case.schema.json
name: k9s-keeps-a-newline-thread-on-one-line-in-pairs-mode
weight: 3
setup:
  stdin: |
    {"level":"INFO","thread_name":"pool\n1","message":"x"}
  run: ["$GAVELDROP_PROJECT/scripts/k9s-log-fmt.sh", "--pairs"]
expect:
  exit_code: 0
  stdout:
    ignore_ansi: true
    equals: "             INFO  [pool\u21b51] - x\t{\"level\":\"INFO\",\"thread_name\":\"pool\\n1\",\"message\":\"x\"}"
