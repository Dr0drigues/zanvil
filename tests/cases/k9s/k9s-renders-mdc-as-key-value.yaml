# yaml-language-server: $schema=https://raw.githubusercontent.com/Dr0drigues/gaveldrop/main/docs/case.schema.json
name: k9s-renders-mdc-as-key-value
weight: 3
setup:
  env:
    ZANVIL_DIR: "$GAVELDROP_PROJECT"
  run:
    - "$GAVELDROP_PROJECT/tests/bin/k9s-fmt-plain"
    - '--line'
    - '{"level":"WARN","thread_name":"main","logger_name":"com.Cleanup","message":"3 orphelins","http.status":503,"retry":2}'
expect:
  exit_code: 0
  stdout:
    contains:
      - 'http.status=503  retry=2'
