# yaml-language-server: $schema=https://raw.githubusercontent.com/Dr0drigues/gaveldrop/main/docs/case.schema.json
name: k9s-flattens-a-newline-inside-an-mdc-value
weight: 3
setup:
  stdin: |
    {"level":"INFO","message":"x","mdc_field":"aaa\nbbb"}
  run: ["$GAVELDROP_PROJECT/scripts/k9s-log-fmt.sh"]
expect:
  exit_code: 0
  stdout:
    ignore_ansi: true
    equals: |2
                   INFO  x
                         mdc_field=aaa↵bbb
