# yaml-language-server: $schema=https://raw.githubusercontent.com/Dr0drigues/gaveldrop/main/docs/case.schema.json
name: k9s-fits-a-stack-and-extras-on-one-line-in-pairs-mode
weight: 3
setup:
  stdin: |
    {"@timestamp":"2026-07-28T08:00:01.456Z","level":"ERROR","thread_name":"main","logger_name":"com.Foo","message":"Boom","stack_trace":"java.lang.IllegalStateException: Boom\n\tat com.Foo.bar(Foo.java:17)","retry":2}
  run: ["$GAVELDROP_PROJECT/scripts/k9s-log-fmt.sh", "--pairs"]
expect:
  exit_code: 0
  stdout:
    ignore_ansi: true
    equals: "08:00:01.456 ERROR [main] com.Foo - Boom \u2937 IllegalStateException  retry=2\t{\"@timestamp\":\"2026-07-28T08:00:01.456Z\",\"level\":\"ERROR\",\"thread_name\":\"main\",\"logger_name\":\"com.Foo\",\"message\":\"Boom\",\"stack_trace\":\"java.lang.IllegalStateException: Boom\\n\\tat com.Foo.bar(Foo.java:17)\",\"retry\":2}"
