# yaml-language-server: $schema=https://raw.githubusercontent.com/Dr0drigues/gaveldrop/main/docs/case.schema.json
name: k9s-renders-a-single-line-without-a-stack
weight: 3
setup:
  stdin: |
    {"level":"INFO","message":"Rien a signaler"}
  run: ["$GAVELDROP_PROJECT/scripts/k9s-log-fmt.sh"]
expect:
  exit_code: 0
  stdout:
    ignore_ansi: true
    equals: "             INFO  Rien a signaler"
