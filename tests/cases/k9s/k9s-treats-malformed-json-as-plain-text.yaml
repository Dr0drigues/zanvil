# yaml-language-server: $schema=https://raw.githubusercontent.com/Dr0drigues/gaveldrop/main/docs/case.schema.json
name: k9s-treats-malformed-json-as-plain-text
weight: 3
setup:
  stdin: |
    {"level":"INFO","message":"accolade manquante"
  run: ["$GAVELDROP_PROJECT/scripts/k9s-log-fmt.sh"]
expect:
  exit_code: 0
  stdout:
    ignore_ansi: true
    equals: "{\"level\":\"INFO\",\"message\":\"accolade manquante\""
