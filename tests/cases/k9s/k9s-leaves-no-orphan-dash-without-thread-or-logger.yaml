# yaml-language-server: $schema=https://raw.githubusercontent.com/Dr0drigues/gaveldrop/main/docs/case.schema.json
name: k9s-leaves-no-orphan-dash-without-thread-or-logger
weight: 3
setup:
  stdin: |
    {"level":"INFO","message":"Ni thread ni logger"}
  run: ["$GAVELDROP_PROJECT/scripts/k9s-log-fmt.sh"]
expect:
  exit_code: 0
  stdout:
    ignore_ansi: true
    equals: "             INFO  Ni thread ni logger"
