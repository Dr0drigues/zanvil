# yaml-language-server: $schema=https://raw.githubusercontent.com/Dr0drigues/gaveldrop/main/docs/case.schema.json
name: k9s-reads-the-throwable-field
weight: 3
setup:
  stdin: |
    {"level":"ERROR","message":"Boom","throwable":"java.io.IOException: broken pipe"}
  run: ["$GAVELDROP_PROJECT/scripts/k9s-log-fmt.sh"]
expect:
  exit_code: 0
  stdout:
    ignore_ansi: true
    equals: |2
                   ERROR Boom
        java.io.IOException: broken pipe
