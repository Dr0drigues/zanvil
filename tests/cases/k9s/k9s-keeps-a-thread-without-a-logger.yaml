# yaml-language-server: $schema=https://raw.githubusercontent.com/Dr0drigues/gaveldrop/main/docs/case.schema.json
name: k9s-keeps-a-thread-without-a-logger
weight: 3
setup:
  stdin: |
    {"level":"INFO","thread_name":"main","message":"Sans logger"}
  run: ["$GAVELDROP_PROJECT/scripts/k9s-log-fmt.sh"]
expect:
  exit_code: 0
  stdout:
    ignore_ansi: true
    equals: "             INFO  [main] - Sans logger"
