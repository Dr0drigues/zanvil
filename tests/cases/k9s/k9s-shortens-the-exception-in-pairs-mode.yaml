# yaml-language-server: $schema=https://raw.githubusercontent.com/Dr0drigues/gaveldrop/main/docs/case.schema.json
name: k9s-shortens-the-exception-in-pairs-mode
weight: 3
setup:
  env:
    ZANVIL_DIR: "$GAVELDROP_PROJECT"
  run:
    - "$GAVELDROP_PROJECT/tests/bin/k9s-fmt-plain"
    - '--pairs'
    - '--field'
    - '1'
    - '--line'
    - '{"@timestamp":"2026-07-28T08:00:01.456Z","level":"ERROR","thread_name":"main","logger_name":"com.Foo","message":"Boom","stack_trace":"java.lang.IllegalStateException: Boom\n\tat com.Foo.bar(Foo.java:17)","retry":2}'
expect:
  exit_code: 0
  stdout:
    contains:
      - '⤷ IllegalStateException'
