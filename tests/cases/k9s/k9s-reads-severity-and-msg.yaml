# yaml-language-server: $schema=https://raw.githubusercontent.com/Dr0drigues/gaveldrop/main/docs/case.schema.json
name: k9s-reads-severity-and-msg
weight: 3
setup:
  stdin: |
    {"@timestamp":"2026-07-28T08:00:02.000Z","severity":"WARN","msg":"Alerte"}
  run: ["$GAVELDROP_PROJECT/scripts/k9s-log-fmt.sh"]
expect:
  exit_code: 0
  stdout:
    ignore_ansi: true
    equals: "08:00:02.000 WARN  Alerte"
