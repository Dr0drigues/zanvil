# yaml-language-server: $schema=https://raw.githubusercontent.com/Dr0drigues/gaveldrop/main/docs/case.schema.json
#
# #149 : les trois requetes passaient `-u ES_USER:ES_PASSWORD` en argument, lisible dans
# `ps`, et le DELETE du scroll partait sans authentification (401 muet, contexte laisse
# ouvert 5 min). Les identifiants passent maintenant par une config curl lue sur stdin,
# DELETE compris. curl est une fonction exportee qui journalise arguments et stdin.
name: fetch-logs-keeps-credentials-out-of-argv
weight: 8
setup:
  run:
    - "bash"
    - "-c"
    - |
      curl() {
        local cfg; cfg=$(cat)
        printf 'ARGS %s\nSTDIN %s\n' "$*" "$cfg" >> journal.txt
        echo '{"hits":{"total":{"value":0},"hits":[]},"_scroll_id":"x"}'
      }
      export -f curl
      bash "$GAVELDROP_PROJECT/modules/work/fetch_es_logs.sh" --app cas --since 1h --target-dir sortie >/dev/null 2>&1
      echo "argv_pw=$(grep '^ARGS' journal.txt | grep -c mot-de-passe-du-cas)"
      echo "delete_auth=$(grep -A1 '^ARGS.*-X DELETE' journal.txt | grep -c '^STDIN user = ')"
  env:
    ES_USER: "cas"
    ES_PASSWORD: "mot-de-passe-du-cas"
    ZANVIL_WORK_ES_URL: "https://es.exemple.invalide"
expect:
  exit_code: 0
  stdout:
    contains: ["argv_pw=0", "delete_auth=1"]
