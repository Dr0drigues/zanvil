# Seconde configuration, et elle existe pour une raison structurelle.
#
# Les modules de modules/tools/ ont deux branches : binaire present, binaire absent.
# Tester la premiere exige `fake.bins`, qui pose un lien symbolique rendant l outil
# trouvable. Tester la seconde exige `setup.hide`, qui le rend introuvable. gaveldrop
# refuse — a juste titre — qu un cas cache un outil que le projet fake :
#
#   case hides `posting` and the project fakes it: `fake.bins` lays down a symlink,
#   which makes it findable, while `setup.hide` exists to make it unfindable.
#
# Or `fake.bins` vit dans la configuration, pas dans le cas, et `cases:` n accepte
# qu un seul motif. Les deux familles ne peuvent donc pas partager une configuration :
# celle-ci ne fake rien et ne couvre que les cas qui cachent.
#
# Voir web/docs/superpowers/specs/2026-07-30-gaveldrop-test-suite-design.md.
cases: tests/cases-hidden/**/*.yaml
