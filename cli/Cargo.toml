[package]
name = "zanvil"
version = "4.4.0"
edition = "2021"
description = "CLI companion for zanvil"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"
regex = "1"
ignore = "0.4"
chrono = "0.4"
# Europe/Paris avec son heure d ete : chrono seul ne connait qu UTC et le fuseau local.
chrono-tz = "0.10"
ratatui = "0.29"
crossterm = "0.28"

[profile.release]
strip = true
lto = true
